name: SafeBox
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  SafeBox:
    type: application
    platform: iOS
    sources:
      - SafeBox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calcplus.calculator
        INFOPLIST_FILE: SafeBox/Support/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: "NO"
  SafeBoxTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SafeBoxTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calcplus.calculator.tests
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: SafeBox
schemes:
  SafeBox:
    build:
      targets:
        SafeBox: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SafeBoxTests
